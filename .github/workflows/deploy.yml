name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ynab-mcp-deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy to aws
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      YNAB_CLIENT_ID: ${{ secrets.YNAB_CLIENT_ID }}
      YNAB_CLIENT_SECRET: ${{ secrets.YNAB_CLIENT_SECRET }}
    steps:
      - name: check out repository
        uses: actions/checkout@v4

      - name: set up node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: install dependencies
        run: npm ci

      - name: type-check
        run: npm run type-check

      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: verify required secrets
        run: |
          test -n "$YNAB_CLIENT_ID"
          test -n "$YNAB_CLIENT_SECRET"
          test -n "${AWS_ACCESS_KEY_ID:-}"
          test -n "${AWS_SECRET_ACCESS_KEY:-}"

      - name: deploy cdk stack
        run: npx cdk deploy YnabMcp --require-approval never
